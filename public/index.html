<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HS-Parse AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F8FAFC;--white:#fff;--border:#E5E7EB;--bl:#F1F5F9;
  --t1:#0F172A;--t2:#64748B;--t3:#94A3B8;
  --ac:#0EA5E9;--ac-bg:#F0F9FF;--ac-bd:#BAE6FD;
  --fin:#D97706;--fin-bg:#FFFBEB;--fin-bd:#FDE68A;
  --adm:#2563EB;--adm-bg:#EFF6FF;--adm-bd:#BFDBFE;
  --exe:#7C3AED;--exe-bg:#F5F3FF;--exe-bd:#DDD6FE;
  --ok:#16A34A;--ok-bg:#DCFCE7;--danger:#DC2626;--danger-bg:#FEF2F2;
  --sw:224px;--th:58px;--r:12px;--rs:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);line-height:1.5;font-size:14px}
/* ── SHARED LAYOUT ── */
.shell{display:flex;min-height:100vh}
.s-bar{width:var(--sw);background:var(--white);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.s-main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.s-main-full{flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:var(--th);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;flex-shrink:0}
#pg-content{flex:1;padding:28px}
/* sidebar */
.sl-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sl-ico{width:32px;height:32px;background:var(--t1);border-radius:8px;display:flex;align-items:center;justify-content:center}
.sl-ico svg{width:17px;height:17px;stroke:white;fill:none;stroke-width:2}
.sl-name{font-size:14px;font-weight:800;letter-spacing:-.3px}
.sl-sub{font-size:10px;color:var(--t2);font-weight:500;margin-top:1px}
.sl-nav{padding:10px 8px;flex:1;overflow-y:auto}
.sl-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);padding:10px 12px 4px}
.sl-it{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);transition:all .12s;margin-bottom:2px;user-select:none}
.sl-it:hover{background:var(--bg);color:var(--t1)}
.sl-it svg{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
.sl-it.active{background:var(--ac-bg);color:var(--ac);font-weight:600}
.sl-it.fin.active{background:var(--fin-bg);color:var(--fin)}
.sl-it.adm.active{background:var(--adm-bg);color:var(--adm)}
.sl-it.exe.active{background:var(--exe-bg);color:var(--exe)}
.sl-it.sum.active{background:#F0FDF4;color:var(--ok)}
.sl-ct{margin-left:auto;background:var(--bg);color:var(--t3);font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center}
.sl-it.active .sl-ct,.sl-it.fin.active .sl-ct{background:var(--fin);color:white}
.sl-it.active .sl-ct{background:var(--ac);color:white}
.sl-it.adm.active .sl-ct{background:var(--adm);color:white}
.sl-it.exe.active .sl-ct{background:var(--exe);color:white}
.sl-it.sum.active .sl-ct{background:var(--ok);color:white}
.sl-foot{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0}
.phase-pill{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:var(--rs)}
.p-dot{width:7px;height:7px;background:var(--ok);border-radius:50%;flex-shrink:0}
.p-label{font-size:11px;font-weight:700;color:var(--ok)}
.p-sub{font-size:10px;color:var(--t3);margin-top:1px}
/* topbar shared */
.tb-left h1{font-size:15px;font-weight:700;letter-spacing:-.3px}
.tb-sub{font-size:12px;color:var(--t2);margin-top:2px}
.tb-right{display:flex;align-items:center;gap:8px}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .12s;font-family:inherit;line-height:1;white-space:nowrap}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.btn-d{background:var(--t1);color:white}.btn-d:hover{background:#1E293B}
.btn-o{background:var(--white);color:var(--t1);border:1.5px solid var(--border)}.btn-o:hover{background:var(--bg)}
.btn-g{background:var(--ok);color:white}.btn-g:hover{background:#15803D}
.btn-sm{padding:5px 10px;font-size:11px}
/* ── ROLE BADGES ── */
.rb{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:.3px}
.rb-admin{background:var(--t1);color:white}
.rb-agent{background:var(--ac-bg);color:var(--ac);border:1px solid var(--ac-bd)}
.rb-head{color:white;padding:3px 9px}
/* ── LOGIN ── */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login-wrap{width:420px}
.login-logo{text-align:center;margin-bottom:24px}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:28px}
.login-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--t2);margin-bottom:22px}
.f-group{margin-bottom:14px}
.f-lbl{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px;display:block}
.f-inp{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;color:var(--t1);transition:border-color .15s;background:var(--white)}
.f-inp:focus{border-color:var(--ac)}
.l-err{background:var(--danger-bg);color:var(--danger);font-size:12px;font-weight:500;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
.cred-card{background:var(--white);border:1px solid var(--border);border-radius:12px;margin-top:14px;overflow:hidden}
.cred-hd{padding:10px 16px;border-bottom:1px solid var(--bl);font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:6px}
.cred-row{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bl);cursor:pointer;transition:background .12s;gap:10px}
.cred-row:last-child{border-bottom:none}
.cred-row:hover{background:var(--bg)}
.cred-role{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.cred-user{font-size:12px;font-weight:600;color:var(--t1);flex:1;font-family:monospace}
.cred-pass{font-size:11px;color:var(--t3);font-family:monospace}
/* ── CARD ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r)}
.c-hd{padding:13px 18px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between}
.c-ttl{font-size:13px;font-weight:700}
.c-sub{font-size:11px;color:var(--t2)}
/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{padding:18px 20px;position:relative;overflow:hidden}
.st-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r) 0 0 var(--r)}
.st-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:8px}
.st-val{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.st-meta{font-size:11px;color:var(--t2);margin-top:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.bf{background:var(--fin-bg);color:var(--fin)}.ba{background:var(--adm-bg);color:var(--adm)}.be{background:var(--exe-bg);color:var(--exe)}.bu{background:var(--bl);color:var(--t2)}.bok{background:var(--ok-bg);color:var(--ok)}
/* ── STATUS BADGES ── */
.st-pending{background:#FEF9C3;color:#854D0E}
.st-approved{background:var(--ok-bg);color:var(--ok)}
.st-changes{background:#FFF7ED;color:#C2410C}
.st-rejected{background:var(--danger-bg);color:var(--danger)}
/* ── TABLE ── */
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse}
table.dt thead{background:var(--bg)}
table.dt th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.dt td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--bl);vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr:hover td{background:#FAFBFD;cursor:pointer}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:12px}.t2{color:var(--t2)}
/* ── UPLOAD ── */
.dz{border:2px dashed var(--border);border-radius:var(--r);padding:36px 24px;text-align:center;cursor:pointer;transition:all .15s;background:var(--white)}
.dz:hover,.dz.over{border-color:var(--ac);background:var(--ac-bg)}
.dz-ico{width:44px;height:44px;background:var(--ac-bg);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.dz-ico svg{width:20px;height:20px;stroke:var(--ac);fill:none;stroke-width:1.5}
.fmt-row{display:flex;gap:5px;justify-content:center}
.fmt{background:var(--bg);color:var(--t2);font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
/* ── QUEUE ── */
.qi{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--bl)}
.qi:last-child{border-bottom:none}
.qi-ico{width:28px;height:28px;background:var(--bg);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qi-ico svg{width:14px;height:14px;stroke:var(--t3);fill:none;stroke-width:1.5}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .8s linear infinite}
/* ── PROGRESS BAR ── */
.pb{height:4px;background:var(--bl);border-radius:2px;overflow:hidden;width:56px}
.pf{height:100%;border-radius:2px}
/* ── AGENT VIEW ── */
.agent-wrap{max-width:760px;margin:0 auto;padding:28px}
.form-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;transition:border-color .15s}
.form-card:hover{border-color:var(--t3)}
.form-card-hd{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.form-card-body{padding:14px 16px;border-top:1px solid var(--bl);background:var(--bg);display:none}
.form-card.open .form-card-body{display:block}
.fc-arrow{transition:transform .2s;flex-shrink:0}
.form-card.open .fc-arrow{transform:rotate(180deg)}
/* ── HEAD VIEW ── */
.head-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.head-stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.hs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:6px}
.hs-val{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
/* ── REVIEW MODAL ACTIONS ── */
.ra-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.ra-btn{padding:10px 8px;border-radius:9px;border:2px solid;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.ra-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}
.ra-approve{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.ra-approve:hover,.ra-approve.sel{background:var(--ok);color:white}
.ra-changes{border-color:#F59E0B;background:#FFFBEB;color:#B45309}
.ra-changes:hover,.ra-changes.sel{background:#F59E0B;color:white}
.ra-reject{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.ra-reject:hover,.ra-reject.sel{background:var(--danger);color:white}
/* ── FIELD GRID ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fi{background:var(--bg);border-radius:8px;padding:10px 12px}
.fi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:3px}
.fi-val{font-size:13px;font-weight:600;color:var(--t1);font-family:monospace}
/* ── SUMMARY PAGE ── */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.period-wrap{display:flex;align-items:center;gap:4px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--border)}
.period-btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;background:transparent;color:var(--t2)}
.period-btn.active{background:var(--white);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* ── MODAL ── */
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#overlay.open{display:flex}
.m-box{background:var(--white);border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column}
.m-hd{padding:16px 20px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1;flex-shrink:0}
.m-ttl{font-size:14px;font-weight:700}
.m-sub{font-size:11px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:6px}
.m-cls{width:26px;height:26px;border:none;background:var(--bg);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-cls svg{width:13px;height:13px;stroke:var(--t2);fill:none;stroke-width:2.5}
.m-body{padding:20px;overflow-y:auto}
/* ── DISPATCH LOG ── */
.dl-it{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--bl)}
.dl-it:last-child{border-bottom:none}
.dl-tick{width:22px;height:22px;border-radius:50%;background:var(--ok-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dl-tick svg{width:11px;height:11px;stroke:var(--ok);fill:none;stroke-width:2.5}
.email-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.email-row{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid var(--bl);align-items:flex-start}
.email-row:last-child{border-bottom:none}
.email-lbl{font-size:11px;font-weight:700;color:var(--t3);width:36px;flex-shrink:0;padding-top:1px}
pre.email-body{background:var(--bg);border-radius:10px;padding:14px;font-family:inherit;font-size:12px;color:var(--t2);line-height:1.75;white-space:pre-wrap;border:1px solid var(--border);max-height:300px;overflow-y:auto}
/* ── EMPTY ── */
.empty{text-align:center;padding:40px 24px}
.e-ico{width:44px;height:44px;background:var(--bg);border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.e-ico svg{width:20px;height:20px;stroke:var(--t3);fill:none;stroke-width:1.5}
.empty h3{font-size:14px;font-weight:700;margin-bottom:4px}
.empty p{font-size:13px;color:var(--t2)}
.act-it{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--bl);cursor:pointer}
.act-it:last-child{border-bottom:none}
.act-it:hover{background:var(--bg)}
.act-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.act-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-time{font-size:11px;color:var(--t3);white-space:nowrap}
#toast{position:fixed;bottom:22px;right:22px;background:var(--t1);color:white;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:100;opacity:0;transform:translateY(6px);transition:all .22s;pointer-events:none;max-width:320px}
#toast.show{opacity:1;transform:translateY(0)}
textarea.rv-txt{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--t1);resize:vertical;min-height:72px;outline:none;transition:border-color .15s}
textarea.rv-txt:focus{border-color:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <div class="m-box">
    <div class="m-hd">
      <div><div class="m-ttl" id="m-ttl">Details</div><div class="m-sub" id="m-sub"></div></div>
      <button class="m-cls" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="m-body" id="m-body"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fi" accept="image/*,.pdf" multiple style="display:none" onchange="handleFiles(this.files)">
<script>

const S = {

// ══════════════════════════════════════
// MOCK DATA

// ══════════════════════════════════════
// OCR ENGINE
// ══════════════════════════════════════
const OCR_PROMPT=`You are an OCR and classification engine. Analyze this handwritten form. Respond ONLY with valid JSON:
{"department":"FINANCE"|"ADMINISTRATIVE"|"EXECUTIVE"|"UNKNOWN","confidence":<0-100>,"transcription":"<text>","extracted_fields":{"agent_name":"","date":"","reference_number":"","subject":"","amount":"","account_number":"","transaction_type":"","authorized_by":"","employee_id":"","request_type":"","approval_status":"","priority_level":"","decision_required":"","recommendation":""},"summary":"<2 sentences>","classification_reasoning":"<1 sentence>","key_terms":["<up to 5>"]}`;

async function runOCR(file){
  // ── Step 1: encode file to base64 ──
  const b64=await new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.onerror=j;rd.readAsDataURL(file)});
  // ── Step 2: resolve MIME type (images + PDF) ──
  const mime=file.type||(file.name?.endsWith('.pdf')?'application/pdf':'image/png');
  // ── Step 3: call backend proxy — API key is server-side ──
  const res=await fetch('/api/ocr',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mime,b64})
  });
  const d=await res.json();
  // ── Step 4: handle errors ──
  if(!res.ok)throw new Error(d.error||'OCR request failed ('+res.status+')');
  return d; // proxy already returns parsed JSON
}

function handleFiles(files){
  const ok=['image/png','image/jpeg','image/jpg','image/webp','application/pdf'];
  [...files].forEach(f=>{
    if(!ok.includes(f.type)){toast('Skipped: '+f.name);return}
    const id=Date.now()+Math.random();
    S.queue.push({id,filename:f.name});
    if(S.page==='upload'||S.user?.role==='agent')boot();
    runOCR(f).then(res=>{
      // Build extracted_fields, filling agent_name from the logged-in user
      // when OCR didn't find it (common on real uploads where the name isn't
      // explicitly written on the form in a detectable way).
      const ef={...res.extracted_fields};
      if(!ef.agent_name) ef.agent_name=S.user?.name||'';

      const form={id,filename:f.name,ts:Date.now(),
        status:'pending',review:null,
        ...res,      // department, confidence, transcription, summary, etc.
        ...ef,       // flattened field values (subject, amount, date, …)
        // These come AFTER the spreads so they are never overwritten:
        agent_name:ef.agent_name,
        agentId:S.user?.username||'',
        extracted_fields:ef};
      S.forms.unshift(form);
      S.queue=S.queue.filter(q=>q.id!==id);
      updBadges();boot();
      toast('✓ '+f.name+' → '+(DC[res.department]?.l||'Unknown'));
    }).catch(e=>{S.queue=S.queue.filter(q=>q.id!==id);boot();toast('Error: '+e.message)});
  });
}

function doLogin(){
  const u=document.getElementById('l-u')?.value.trim();
  const p=document.getElementById('l-p')?.value;
  const user=USERS[u];
  const err=document.getElementById('l-err');
  if(!user||user.pass!==p){if(err)err.style.display='block';return}
  S.user={username:u,...user};
  S.page='dashboard';S.headTab='all';
  boot();
}
function logout(){S.user=null;S.page='dashboard';S.headTab='all';S.log=[];boot()}
function autofill(u,p){
  const eu=document.getElementById('l-u');const ep=document.getElementById('l-p');
  if(eu)eu.value=u;if(ep)ep.value=p;
  const err=document.getElementById('l-err');if(err)err.style.display='none';
}

}

          // Date       → OCR value  → upload timestamp (always known)
          const dispRef  = f.reference_number || ('SYS-'+String(f.id).padStart(6,'0'));

function openReview(id){

  S.reviewFormId=id;S.reviewAction=null;
  const af=Object.entries(f.extracted_fields||{}).filter(([,v])=>v&&v.trim());
  document.getElementById('m-ttl').textContent='Review Form';
  document.getElementById('m-sub').innerHTML=`<span class="bdg ${cfg.bd}">${cfg.l}</span><span>·</span><span>${f.reference_number||('SYS-'+String(f.id).padStart(6,'0'))}</span>`;
  document.getElementById('m-body').innerHTML=`
  ${f.status!=='pending'?`<div style="background:var(--bl);border-radius:8px;padding:10px 13px;margin-bottom:14px;font-size:12px;color:var(--t2)"><strong style="color:var(--t1)">Previous review:</strong> ${statusBadge(f.status)}${f.review?.comment?' — "'+f.review.comment+'"':''}</div>`:''}
  <div style="background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--t2);line-height:1.6">
    <strong style="color:var(--t1)">Agent:</strong> ${f.agent_name||'—'} &nbsp;·&nbsp; <strong style="color:var(--t1)">Date:</strong> ${f.date||ftm(f.ts)} &nbsp;·&nbsp; <strong style="color:var(--t1)">Ref:</strong> ${f.reference_number||('SYS-'+String(f.id).padStart(6,'0'))}
    ${f.summary?'<br><br>'+f.summary:''}
  </div>
  ${af.length>0?`<div style="margin-bottom:14px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:8px">Form Details</div><div class="fg">${af.slice(0,6).map(([k,v])=>`<div class="fi"><div class="fi-lbl">${k.replace(/_/g,' ')}</div><div class="fi-val">${v}</div></div>`).join('')}</div></div>`:''}
  ${f.transcription?`<div style="margin-bottom:16px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:6px">OCR Transcription</div><pre style="background:var(--bg);border-radius:8px;padding:12px;font-family:monospace;font-size:11px;color:var(--t1);line-height:1.7;white-space:pre-wrap;max-height:140px;overflow-y:auto;border:1px solid var(--border)">${f.transcription}</pre></div>`:''}
  <div style="border-top:1px solid var(--bl);padding-top:16px">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:10px">Your Decision</div>
    <div class="ra-grid">
      <button id="ra-approve" class="ra-btn ra-approve" onclick="selAction('approved')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Approve</button>
      <button id="ra-changes" class="ra-btn ra-changes" onclick="selAction('changes_requested')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Request Changes</button>
      <button id="ra-reject" class="ra-btn ra-reject" onclick="selAction('rejected')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Reject</button>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px">Remark <span style="font-weight:400;color:var(--t3)">(optional)</span></div>
      <textarea class="rv-txt" id="rv-comment" placeholder="Add your comment or reason...">${f.review?.comment||''}</textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button id="rv-submit" class="btn btn-d" onclick="submitReview()" style="opacity:.35;cursor:not-allowed" disabled>Submit Decision</button>
      <button class="btn btn-o" onclick="closeModal()">Cancel</button>
    </div>
  </div>`;
  document.getElementById('overlay').classList.add('open');
}
function selAction(action){
  S.reviewAction=action;
  const map={approved:'ra-approve',changes_requested:'ra-changes',rejected:'ra-reject'};
  ['approved','changes_requested','rejected'].forEach(a=>{const b=document.getElementById(map[a]);if(b)b.classList.toggle('sel',a===action)});
  const sub=document.getElementById('rv-submit');
  if(sub){sub.disabled=false;sub.style.opacity='1';sub.style.cursor='pointer'}
}
function submitReview(){
  if(!S.reviewAction)return;
  const f=S.forms.find(x=>x.id==S.reviewFormId);if(!f)return;
  const comment=(document.getElementById('rv-comment')?.value||'').trim();
  f.status=S.reviewAction;
  f.review={action:S.reviewAction,comment,reviewer:S.user.name,ts:Date.now()};
  closeModal();
  const labels={approved:'Approved ✓',changes_requested:'Changes requested',rejected:'Rejected'};
  toast(labels[S.reviewAction]+' — '+f.reference_number);
  boot();
}

function deptBlock(dept,allForms){
  const cfg=DC[dept],forms=allForms.filter(f=>f.department===dept),n=forms.length;
  const agentMap={};forms.forEach(f=>{const nm=f.agent_name||'Unknown';if(!agentMap[nm])agentMap[nm]={name:nm,forms:[]};agentMap[nm].forms.push(f)});
  const agents=Object.values(agentMap).sort((a,b)=>b.forms.length-a.forms.length);
  const avgC=n?Math.round(forms.reduce((s,f)=>s+(f.confidence||0),0)/n):0;
  const maxForms=agents.length?Math.max(...agents.map(a=>a.forms.length)):1;
  return`<div class="card" style="margin-bottom:14px">
  <div style="padding:14px 18px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px"><div style="width:8px;height:8px;border-radius:50%;background:${cfg.c}"></div><div><div style="font-size:13px;font-weight:700;color:${cfg.c}">${cfg.l}</div><div style="font-size:11px;color:var(--t2)">${n} forms · ${agents.length} agents · Avg ${avgC}%</div></div></div>
    <div style="display:flex;gap:6px"><button class="btn btn-o btn-sm" onclick="expCSV('${dept}')">CSV</button><button class="btn btn-d btn-sm" onclick="emailSummary('${dept}')">Email ${cfg.l}</button></div>
  </div>
  ${n===0?`<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px">No ${cfg.l} forms in this period</div>`:`
  <div class="tw"><table class="dt"><thead><tr><th>Agent</th><th>Forms</th><th>References</th><th>Last Active</th></tr></thead><tbody>
  ${agents.map(a=>{const initials=a.name.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();const bw=Math.round((a.forms.length/maxForms)*100);const refs=a.forms.slice(0,2).map(f=>f.reference_number||'—').filter(r=>r!=='—').join(', ')+(a.forms.length>2?` +${a.forms.length-2}`:'');return`<tr><td><div style="display:flex;align-items:center;gap:9px"><div style="width:28px;height:28px;border-radius:50%;background:${cfg.bg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${cfg.c};flex-shrink:0">${initials}</div><span style="font-weight:600">${a.name}</span></div></td><td><div style="display:flex;align-items:center;gap:8px"><div class="pb" style="width:64px"><div class="pf" style="width:${bw}%;background:${cfg.c}"></div></div><span class="mono" style="font-weight:700;color:${cfg.c}">${a.forms.length}</span></div></td><td class="mono t2" style="font-size:11px">${refs||'—'}</td><td class="t2">${ftm(Math.max(...a.forms.map(f=>f.ts)))}</td></tr>`}).join('')}
  </tbody></table></div>`}
  </div>`;
}

function emailSummary(dept){
  const p=S.period,cfg=DC[dept],since=periodSince(p);
  const forms=S.forms.filter(f=>f.ts>=since&&f.department===dept);
  if(!forms.length){toast('No '+cfg.l+' forms in this period');return}
  const agentMap={};forms.forEach(f=>{const nm=f.agent_name||'Unknown';if(!agentMap[nm])agentMap[nm]=[];agentMap[nm].push(f)});
  const agents=Object.entries(agentMap);
  const avgC=Math.round(forms.reduce((s,f)=>s+(f.confidence||0),0)/forms.length);
  const dr=dateRange(p),pl=pLabel(p),now=new Date().toLocaleString('en-IN',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const agentLines=agents.map(([n,fs])=>`  • ${n.padEnd?n.padEnd(24):n}  ${fs.length} form${fs.length>1?'s':''}  —  ${fs.map(f=>f.reference_number||'—').join(', ')}`).join('\n');
  const body=`HS-Parse AI  |  ${pl.toUpperCase()} REPORT\nGenerated: ${now}\n${'─'.repeat(50)}\n\nDear ${cfg.l} Department Head,\n\nPERIOD     ${dr}\nDEPT       ${cfg.l}\nFORMS      ${forms.length}\nAGENTS     ${agents.length} unique\nCONFIDENCE Avg ${avgC}%\n\n${'─'.repeat(50)}\nAGENT BREAKDOWN\n${'─'.repeat(50)}\n${agentLines}\n${'─'.repeat(50)}\n\nHS-Parse AI — Form Intelligence Platform`;
  document.getElementById('m-ttl').textContent=pl+' Summary — '+cfg.l;
  document.getElementById('m-sub').innerHTML=`<span class="bdg ${cfg.bd}">${cfg.l}</span><span>·</span><span>${forms.length} forms</span>`;
  document.getElementById('m-body').innerHTML=`<div class="email-card"><div class="email-row"><div class="email-lbl">To:</div><div class="email-val">${dept.toLowerCase()}.head@company.com</div></div><div class="email-row"><div class="email-lbl">Re:</div><div class="email-val" style="font-weight:700">[${pl}] Summary — ${cfg.l}</div></div></div><pre class="email-body">${body}</pre><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-g" onclick="confirmSend('${dept}',${forms.length},${agents.length})"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Dispatch</button><button class="btn btn-o" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById('overlay').classList.add('open');
}
function emailAllDepts(){
  const p=S.period,since=periodSince(p),forms=S.forms.filter(f=>f.ts>=since);
  if(!forms.length){toast('No forms in this period');return}
  const agents=new Set(forms.map(f=>f.agent_name||'?')).size;
  const depts=['FINANCE','ADMINISTRATIVE','EXECUTIVE'].filter(d=>forms.some(f=>f.department===d));
  const pl=pLabel(p),dr=dateRange(p),now=new Date().toLocaleString('en-IN',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const body=`HS-Parse AI  |  ${pl.toUpperCase()} CONSOLIDATED\nGenerated: ${now}\n${'─'.repeat(50)}\n\nPERIOD   ${dr}\nFORMS    ${forms.length} total\nAGENTS   ${agents} unique\nDEPTS    ${depts.length} active\n\n${depts.map(d=>{const cfg=DC[d],df=forms.filter(f=>f.department===d),am={};df.forEach(f=>{const n=f.agent_name||'?';if(!am[n])am[n]=0;am[n]++});return`${cfg.l.toUpperCase()} (${df.length} forms)\n${Object.entries(am).map(([n,c])=>`  • ${n}: ${c} form${c>1?'s':''}`).join('\n')}`}).join('\n\n')}\n\n${'─'.repeat(50)}\nHS-Parse AI — Form Intelligence Platform`;
  document.getElementById('m-ttl').textContent='Consolidated '+pl;
  document.getElementById('m-sub').innerHTML=`<span class="bdg bu">All Depts</span><span>·</span><span>${forms.length} forms</span>`;
  document.getElementById('m-body').innerHTML=`<div class="email-card"><div class="email-row"><div class="email-lbl">To:</div><div class="email-val">${depts.map(d=>DC[d].l.toLowerCase()+'.head@company.com').join(', ')}</div></div><div class="email-row"><div class="email-lbl">Re:</div><div class="email-val" style="font-weight:700">[${pl}] Consolidated Summary</div></div></div><pre class="email-body">${body}</pre><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-g" onclick="confirmSendAll(${forms.length},${agents})">Dispatch to All</button><button class="btn btn-o" onclick="closeModal()">Cancel</button></div>`;
  document.getElementById('overlay').classList.add('open');
}

  <div style="background:${cfg.bg};border:1px solid ${cfg.c}30;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
    <div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:${cfg.c};margin-bottom:3px">Classified As</div><div style="font-size:20px;font-weight:800;color:${cfg.c}">${cfg.l}</div><div style="font-size:12px;color:var(--t2);margin-top:4px">${f.classification_reasoning||''}</div></div>
    <div style="text-align:right"><div style="font-size:10px;color:var(--t3)">Confidence</div><div style="font-size:26px;font-weight:800;font-family:monospace;color:${c>=70?'var(--ok)':c>=50?'var(--fin)':'var(--danger)'}">${c}%</div><div class="pb" style="width:64px;margin:4px 0 0 auto"><div class="pf" style="width:${c}%;background:${cfg.c}"></div></div></div>
  </div>
  ${f.review?`<div style="background:${f.status==='approved'?'var(--ok-bg)':f.status==='rejected'?'var(--danger-bg)':'#FFF7ED'};border-radius:8px;padding:12px 14px;margin-bottom:14px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:5px">Head Review — ${statusBadge(f.status)}</div><div style="font-size:13px;color:var(--t1)">${f.review.comment||'No comment.'}</div><div style="font-size:11px;color:var(--t3);margin-top:5px">— ${f.review.reviewer} · ${ftm(f.review.ts)}</div></div>`:''}
  ${f.summary?`<div style="background:var(--bg);border-radius:8px;padding:11px 13px;margin-bottom:14px;font-size:13px;color:var(--t2);line-height:1.6"><strong style="color:var(--t1)">Summary:</strong> ${f.summary}</div>`:''}
  ${af.length>0?`<div style="margin-bottom:14px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:9px">Extracted Fields</div><div class="fg">${af.map(([k,v])=>`<div class="fi"><div class="fi-lbl">${k.replace(/_/g,' ')}</div><div class="fi-val">${v}</div></div>`).join('')}</div></div>`:''}
  ${f.transcription?`<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:8px">OCR Transcription</div><pre style="background:var(--bg);border-radius:8px;padding:12px;font-family:monospace;font-size:11px;color:var(--t1);line-height:1.7;white-space:pre-wrap;max-height:160px;overflow-y:auto;border:1px solid var(--border)">${f.transcription}</pre></div>`:''}
  <div style="display:flex;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bl)">
    <button class="btn btn-d btn-sm" onclick="expOneJSON(${f.id})">Export JSON</button>
    <button class="btn btn-o btn-sm" onclick="expOneCSV(${f.id})">Export CSV</button>
  </div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal()});

// ══════════════════════════════════════
// CHART
// ══════════════════════════════════════
function initChart(){
  const ctx=document.getElementById('dc');if(!ctx)return;
  if(S.chart){S.chart.destroy();S.chart=null}
  const fin=cntD('FINANCE'),adm=cntD('ADMINISTRATIVE'),exe=cntD('EXECUTIVE'),tot=fin+adm+exe;
  S.chart=new Chart(ctx,{type:'doughnut',data:{labels:['Finance','Administrative','Executive'],datasets:[{data:tot===0?[1,1,1]:[fin,adm,exe],backgroundColor:tot===0?['#E5E7EB','#E5E7EB','#E5E7EB']:['#D97706','#2563EB','#7C3AED'],borderWidth:0,hoverOffset:3}]},options:{responsive:true,maintainAspectRatio:true,cutout:'70%',plugins:{legend:{display:false},tooltip:{enabled:tot>0}}}});
}

// ══════════════════════════════════════
// PERIOD UTILS
// ══════════════════════════════════════
function periodSince(p){return Date.now()-({daily:86400000,weekly:604800000,monthly:2592000000}[p]||604800000)}
function periodForms(p){return S.forms.filter(f=>f.ts>=periodSince(p))}
function pLabel(p){return{daily:'Daily Summary',weekly:'Weekly Summary',monthly:'Monthly Summary'}[p]||'Summary'}
function dateRange(p){const s=new Date(periodSince(p)),n=new Date();const fmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});return fmt(s)+' – '+fmt(n)+', '+n.getFullYear()}
function topDept(forms){if(!forms.length)return null;const c={};forms.forEach(f=>{c[f.department]=(c[f.department]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||null}

// ══════════════════════════════════════
// EXPORT
// ══════════════════════════════════════
const HDR=['Filename','Dept','Confidence','Agent','Date','Ref','Subject','Amount','Account','Transaction','Auth By','Emp ID','Request','Status','Priority','Decision','Recommendation','Summary','Review Status','Review Comment'];
function fmtRow(f){return[f.filename,f.department,(f.confidence||0)+'%',f.agent_name||'',f.date||'',f.reference_number||'',f.subject||'',f.amount||'',f.account_number||'',f.transaction_type||'',f.authorized_by||'',f.employee_id||'',f.request_type||'',f.approval_status||'',f.priority_level||'',f.decision_required||'',f.recommendation||'',f.summary||'',f.status||'pending',f.review?.comment||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')}
function dlF(ct,nm,tp){const b=new Blob([ct],{type:tp}),url=URL.createObjectURL(b);Object.assign(document.createElement('a'),{href:url,download:nm}).click();URL.revokeObjectURL(url)}
function expCSV(d){const f=S.forms.filter(x=>x.department===d);if(!f.length){toast('No forms');return}dlF([HDR.map(h=>`"${h}"`).join(','),...f.map(fmtRow)].join('\n'),d+'_'+Date.now()+'.csv','text/csv');toast('Exported '+f.length+' forms')}
function expJSON(d){dlF(JSON.stringify(S.forms.filter(x=>x.department===d),null,2),d+'_'+Date.now()+'.json','application/json');toast('JSON exported')}
function expAll(){if(!S.forms.length){toast('No forms');return}dlF([HDR.map(h=>`"${h}"`).join(','),...S.forms.map(fmtRow)].join('\n'),'all_forms_'+Date.now()+'.csv','text/csv');toast('Exported all')}
function expOneJSON(id){const f=S.forms.find(x=>x.id==id);if(!f)return;dlF(JSON.stringify(f,null,2),'form_'+(f.reference_number||id)+'.json','application/json');toast('JSON exported')}
function expOneCSV(id){const f=S.forms.find(x=>x.id==id);if(!f)return;dlF([HDR.map(h=>`"${h}"`).join(','),fmtRow(f)].join('\n'),'form_'+(f.reference_number||id)+'.csv','text/csv');toast('CSV exported')}
function expSummaryCSV(){const p=S.period,forms=periodForms(p);if(!forms.length){toast('No forms in period');return}const rows=[['Period','Dept','Agent','Forms','References','Avg Conf','Status']];['FINANCE','ADMINISTRATIVE','EXECUTIVE'].forEach(d=>{const am={};forms.filter(f=>f.department===d).forEach(f=>{const n=f.agent_name||'?';if(!am[n])am[n]=[];am[n].push(f)});const df=forms.filter(f=>f.department===d),avgC=df.length?Math.round(df.reduce((s,f)=>s+f.confidence,0)/df.length):0;Object.entries(am).forEach(([n,fs])=>rows.push([pLabel(p),DC[d].l,n,fs.length,fs.map(f=>f.reference_number||'—').join('; '),avgC+'%',fs[0]?.status||'—']))});dlF(rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'summary_'+S.period+'_'+Date.now()+'.csv','text/csv');toast('Summary exported')}

// ══════════════════════════════════════
// UTILS
// ══════════════════════════════════════
function cntD(d){return S.forms.filter(f=>f.department===d).length}
function ftm(ts){const d=new Date(ts),now=new Date(),diff=(now-d)/1000;if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function statusBadge(s){const m={pending:'<span class="bdg st-pending">Pending</span>',approved:'<span class="bdg st-approved">Approved</span>',changes_requested:'<span class="bdg st-changes">Changes Requested</span>',rejected:'<span class="bdg st-rejected">Rejected</span>'};return m[s]||m.pending}
function updBadges(){try{const bq=document.getElementById('b-q');if(bq)bq.textContent=S.queue.length||'0';const bf=document.getElementById('b-f');if(bf)bf.textContent=cntD('FINANCE')||'0';const ba=document.getElementById('b-a');if(ba)ba.textContent=cntD('ADMINISTRATIVE')||'0';const be=document.getElementById('b-e');if(be)be.textContent=cntD('EXECUTIVE')||'0';const bs=document.getElementById('b-s');if(bs)bs.textContent=S.log.length||'0'}catch(e){}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function clearAll(){if(!confirm('Clear all forms and reset demo?'))return;S.forms=[];S.log=[];updBadges();renderAdminPage();toast('Cleared')}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
boot();
</script>
</body>
